<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F8">
<title>Eng_bot</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="guide.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Фон: три пятна, размытые один раз, дальше двигаются только по transform.
     Именно они дают стеклу что преломлять — на плоской заливке стекло не читается. -->
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="topbar">
  <button id="home-btn" class="g-back" title="На главный экран" aria-label="На главный экран" hidden>‹</button>
  <span id="counter" class="counter"></span>
  <span class="progress-track"><span id="progress" class="progress-fill"></span></span>
  <span id="pending" class="pending"></span>
  <a class="g-help" href="guide.html" title="Гайд" aria-label="Открыть гайд">?</a>
</header>

<div id="banner" class="banner" hidden></div>

<main class="stage">

  <section id="screen-loading" class="state center">
    <div class="state-icon">◌</div>
    <p class="muted">Загружаю очередь…</p>
  </section>

  <section id="screen-card" hidden>
    <article id="card" class="card">
      <div class="meta">
        <span id="direction" class="tag tag-accent"></span>
        <span id="type" class="tag"></span>
        <span id="layer" class="tag"></span>
      </div>

      <p id="prompt" class="prompt"></p>

      <input id="typebox" class="typebox" type="text" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false" hidden>
      <p id="typehint" class="hint" hidden>Набери по-английски и нажми «Показать»</p>

      <div id="answer-block" class="answer-block" hidden>
        <div class="divider"></div>
        <p id="answer" class="answer"></p>
        <p id="example" class="example"></p>
        <p id="example-ru" class="example example-ru"></p>
      </div>

      <button id="reveal" class="btn btn-primary">Показать</button>

      <div id="ratings" class="ratings" hidden>
        <button class="btn rate rate-again" data-rating="1">Не помню<span class="key">1</span></button>
        <button class="btn rate rate-hard"  data-rating="2">С трудом<span class="key">2</span></button>
        <button class="btn rate rate-good"  data-rating="3">Помню<span class="key">3</span></button>
        <button class="btn rate rate-easy"  data-rating="4">Легко<span class="key">4</span></button>
      </div>
    </article>
  </section>

  <section id="screen-empty" hidden class="state center">
    <div class="state-icon">✓</div>
    <h1>На сегодня всё</h1>
    <p class="muted" id="empty-body">Очередь пуста.</p>
  </section>

  <section id="screen-done" hidden class="state center">
    <div class="state-icon">✓</div>
    <h1>Сессия закрыта</h1>
    <p id="done-body" class="muted"></p>
    <p id="flush-status" class="hint"></p>
    <button id="again-session" class="btn btn-quiet">Ещё раз</button>
  </section>

  <section id="screen-home" hidden class="state">
    <h1 class="home-title">Что тренируем</h1>
    <div class="tiles">
      <button id="tile-vocab" class="tile">
        <span class="tile-name">Лексика</span>
        <span class="tile-sub">слова и словосочетания по расписанию</span>
        <span id="tile-vocab-count" class="tile-count"></span>
      </button>
      <button id="tile-grammar" class="tile">
        <span class="tile-name">Грамматика</span>
        <span class="tile-sub">времена и порядок слов, по шаблонам</span>
        <span id="tile-grammar-count" class="tile-count"></span>
      </button>
    </div>
    <p id="home-note" class="hint" hidden></p>
  </section>

  <section id="screen-picker" hidden class="state">
    <h1 class="home-title">Грамматика</h1>
    <button id="pick-mixed" class="tile tile-wide">
      <span class="tile-name">Вперемешку</span>
      <span id="pick-mixed-sub" class="tile-sub"></span>
    </button>
    <p class="picker-or">или выбери шаблон</p>
    <div id="pattern-list" class="pattern-list"></div>
  </section>

  <section id="screen-grammar" hidden>
    <article id="gcard" class="card">
      <div class="meta">
        <a id="g-label" class="tag tag-accent" target="_blank" rel="noopener"></a>
        <span id="g-title" class="tag"></span>
        <span id="g-kind" class="tag"></span>
      </div>

      <p id="g-instruction" class="ghint-line"></p>
      <p id="g-prompt" class="prompt prompt-ru" hidden></p>
      <p id="g-stem" class="g-stem" hidden></p>

      <div id="g-tokens" class="tokens" hidden>
        <div id="g-slots" class="slots" aria-live="polite"></div>
        <div id="g-bank" class="bank"></div>
      </div>

      <input id="g-input" class="typebox" type="text" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false" hidden>

      <p id="g-hint" class="ghint" hidden></p>

      <div id="g-verdict" class="verdict" hidden>
        <p id="g-verdict-line" class="verdict-line"></p>
        <p id="g-answer" class="answer"></p>
      </div>

      <div class="g-actions">
        <button id="g-check" class="btn btn-primary">Проверить</button>
        <button id="g-next" class="btn btn-primary" hidden>Дальше</button>
        <button id="g-hint-btn" class="btn btn-quiet">Подсказка</button>
      </div>
    </article>
  </section>

  <section id="screen-round" hidden class="state center">
    <div class="state-icon">✓</div>
    <h1>Раунд закрыт</h1>
    <p id="round-label" class="muted"></p>
    <p id="round-score" class="hint"></p>
    <button id="round-next" class="btn btn-primary">Следующий шаблон</button>
    <button id="round-again" class="btn btn-quiet">Ещё раунд по этому шаблону</button>
  </section>

  <section id="screen-gdone" hidden class="state center">
    <div class="state-icon">✓</div>
    <h1>Грамматика на сегодня закрыта</h1>
    <p id="gdone-body" class="muted"></p>
    <pre id="gdone-outcomes" class="diag-out" hidden></pre>
    <p id="gflush-status" class="hint"></p>
    <button id="gdone-home" class="btn btn-quiet">Назад</button>
  </section>

  <section id="screen-error" hidden class="state center">
    <div class="state-icon">!</div>
    <h1>Не получилось</h1>
    <p id="error-body" class="muted"></p>
    <p id="error-code" class="hint"></p>
    <button id="retry" class="btn btn-primary">Повторить</button>
    <button id="diag" class="btn btn-quiet" hidden>Показать диагностику</button>
    <pre id="diag-out" class="diag-out" hidden></pre>
  </section>

</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="api.js"></script>
<script src="answer.js"></script>
<script src="session.js"></script>
<script src="grammar.js"></script>
<script src="ui.js"></script>
<script src="grammar-ui.js"></script>
</body>
</html>
