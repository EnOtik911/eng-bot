        - heading "Единица карточки — не слово" [level=4] [ref=e71]
        - paragraph [ref=e72]: "«Думаю по-русски и перевожу» не лечится словами: перевод по одному слову — это и есть симптом. Лечится готовыми блоками — коллокациями и фразами-шаблонами."
      - generic [ref=e74]:
        - generic [ref=e75]: гипотеза 3
        - heading "Аудирование не строим с нуля" [level=4] [ref=e76]
        - paragraph [ref=e77]: Радиообмен дал восприятие под нагрузкой, и навык свежий. Отдельный трек аудирования в MVP не нужен — это экономия, которую можно потратить на продукцию.
    - heading "Решение по авторизации" [level=3] [ref=e78]
    - generic [ref=e80]:
      - paragraph [ref=e81]: "Ты сказал «решай сам» и заодно упомянул, что может захотеться дать бота знакомым. Решаю так: single-user остаётся — это жёсткое ограничение из твоего брифа, и multi-tenancy я не строю. Но реализую проверку как allowlist из массива user_id, а не как одну константу, и кладу user_id колонкой в схему прогресса с первого дня."
      - paragraph [ref=e82]: "Сегодня это стоит ноль: одна строка вместо одной строки, одна колонка с одним значением. Но если через полгода ты дашь бота знакомому — это правка одной ячейки в Sheets, а не переделка схемы, импорта и всей логики прогресса. Обратный порядок (сначала константа, потом «а давай ещё людей») стоит переписывания хранилища."
      - alert [ref=e83]:
        - generic [ref=e84]: Кандидат в ADR-01. Формально это не отклонение от ограничения — доступ остаётся закрытым, меняется только форма проверки.
