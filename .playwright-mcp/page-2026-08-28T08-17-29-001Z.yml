        - heading "Production-first, а не recognition-first" [level=4] [ref=e66]
        - paragraph [ref=e67]: Тренировать надо отстающее. Соотношение EN→RU / RU→EN по умолчанию, вероятно, надо перевернуть относительно того, что заложено в брифе.
