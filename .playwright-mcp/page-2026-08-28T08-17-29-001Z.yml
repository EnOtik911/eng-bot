      - heading "Диагноз не тот, что предполагал бриф" [level=3] [ref=e57]
      - paragraph [ref=e58]: "Бриф говорил: «база лексики — первое узкое место». Твои ответы говорят другое. Ты не отметил «не успеваю разбирать быструю речь» и не отметил «спотыкаюсь на терминах в спеках». Отметил три вещи: лексики мало, не собираю фразу на ходу, и знаю слова пассивно — но в момент речи они не приходят."
      - paragraph [ref=e59]: "Это не дефицит объёма. Это дефицит извлечения: вход работает лучше выхода. Плюс у тебя живой (полгода назад) навык восприятия речи под нагрузкой из радиообмена — рецепция явно опережает продукцию."
    - heading "Что из этого следует для Track A" [level=3] [ref=e60]
    - paragraph [ref=e61]: "Это рабочие гипотезы, а не выводы: они идут в исследование как то, что нужно подтвердить или опрокинуть источниками, а не как готовые решения."
